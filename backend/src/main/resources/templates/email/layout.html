<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Layout común de los emails. Estilos inline: los clientes de correo ignoran <style> en muchos casos. */-->
<div th:fragment="layout(title, content)"
     style="margin:0;padding:24px 12px;background:#F6F8FC;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#0D141F;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="max-width:560px;margin:0 auto;background:#FFFFFF;border:1px solid #DCE3EF;border-radius:14px;overflow:hidden;">
    <tr>
      <td style="background:#08131F;padding:20px 28px;">
        <span style="display:inline-block;width:22px;height:22px;border:4px solid #007EE8;border-right-color:transparent;border-radius:50%;vertical-align:middle;"></span>
        <span style="color:#FFFFFF;font-size:17px;font-weight:700;vertical-align:middle;margin-left:8px;">Climind Cotiza</span>
      </td>
    </tr>
    <tr>
      <td style="padding:28px;">
        <h1 style="margin:0 0 16px;font-size:21px;line-height:1.3;color:#0D141F;" th:text="${title}">Título</h1>
        <div style="font-size:15px;line-height:1.6;color:#4C5A72;" th:replace="${content}">Contenido</div>
      </td>
    </tr>
    <tr>
      <td style="padding:18px 28px;border-top:1px solid #E8EDF6;font-size:12px;line-height:1.5;color:#7A879C;">
        Climind Cotiza es un producto de Climind SaaS, de Climind-IA.<br>
        Recibiste este email por una acción realizada en tu cuenta. Si no fuiste vos, podés ignorarlo.
      </td>
    </tr>
  </table>
</div>
</body>
</html>
