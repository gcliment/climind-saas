<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${subject}">Asunto</title></head>
<body th:replace="~{email/layout :: layout(${'Restablecé tu contraseña'}, ~{::content})}">
<div th:fragment="content">
  <p style="margin:0 0 14px;">Hola <strong th:text="${firstName}">Nombre</strong>:</p>
  <p style="margin:0 0 20px;">Recibimos un pedido para restablecer la contraseña de tu cuenta. Elegí una nueva desde este enlace:</p>
  <p style="margin:0 0 22px;">
    <a th:href="${link}" href="#"
       style="display:inline-block;background:#0071DB;color:#FFFFFF;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:8px;">Elegir una contraseña nueva</a>
  </p>
  <p style="margin:0 0 8px;font-size:13px;">El enlace vence en 1 hora y se puede usar una sola vez. Si no lo pediste, ignorá este email: tu contraseña no cambia.</p>
  <p style="margin:0;font-size:12px;word-break:break-all;color:#0063C7;" th:text="${link}">link</p>
</div>
</body>
</html>
