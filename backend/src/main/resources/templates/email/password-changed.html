<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${subject}">Asunto</title></head>
<body th:replace="~{email/layout :: layout(${'Cambiaste tu contraseña'}, ~{::content})}">
<div th:fragment="content">
  <p style="margin:0 0 14px;">Hola <strong th:text="${firstName}">Nombre</strong>:</p>
  <p style="margin:0 0 14px;">La contraseña de tu cuenta de Climind Cotiza se cambió correctamente. Por seguridad, cerramos las sesiones abiertas en otros dispositivos.</p>
  <p style="margin:0;font-size:13px;">Si no fuiste vos, <a th:href="${resetLink}" href="#" style="color:#0063C7;">restablecé tu contraseña</a> y escribinos.</p>
</div>
</body>
</html>
