<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar — Climind Cotiza</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/shared/img/favicon-cotiza.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/bootstrap-5.3.8/bootstrap.min.css">
  <link rel="stylesheet" href="/shared/css/climind.css">
  <link rel="stylesheet" href="/shared/css/auth.css">
</head>
<body class="auth-page" data-page="ingresar">
<header class="auth-top">
  <div class="container">
    <a class="brand" href="/"><img src="/shared/img/cotiza-mark.svg" alt="" width="34" height="34"><span>Climind Cotiza</span></a>
  </div>
</header>
<main class="auth-main">
  <div class="auth-card">
    <h1>Ingresá a tu cuenta</h1>
    <p class="subtitle">Administrá tus cotizadores y las consultas de tus clientes.</p>
    <form id="login-form" novalidate>
      <div class="notice" id="login-notice" hidden></div>
      <div>
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" required>
      </div>
      <div>
        <label class="form-label" for="password">Contraseña</label>
        <div class="password-field">
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
          <button type="button" class="toggle-password" aria-pressed="false" aria-controls="password">Mostrar</button>
        </div>
      </div>
      <button class="btn btn-primary" type="submit">Ingresar</button>
      <div class="auth-links">
        <a href="/recuperar">Olvidé mi contraseña</a>
      </div>
    </form>
    <p class="auth-alt">¿Todavía no tenés cuenta? <a href="/registro">Creala gratis</a></p>
  </div>
</main>
<script type="module" src="/shared/js/auth.js"></script>
</body>
</html>
